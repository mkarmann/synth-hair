train:
  name: Attributes4096
  out_folder: ./runs
  device: cuda:0
  training_resolution: 4096
  epochs: 3
  batch_size: 1
  backbone_learning_rate: 0.0
  head_learning_rate: 1.0e-05
  reduce_lr_after_each: 10
  reduce_lr_by_a_factor_of: 0.1
  continue_from_ckpt: null  # Insert a checkpoint path here to finetune from it.
  seed: 2025
  use_training_augmentation: true
  build_dpt: true
  backbone: dinov2_vits14
  model_type: all_attributes_2d
  resnet_width: 12
  resnet_depth: 4
  resnet_stages: 4
  backbone_extra_patch_levels: 2
  train_dataset: SynthHair
